<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="No product image">
  <!-- Shown when a product has no uploaded image (the API returns imageUrl: null until an
       admin uploads one). Neutral and on-brand rather than a broken-image icon. -->
  <rect width="400" height="400" fill="#f6f1f3"/>
  <g fill="none" stroke="#c9a3b4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup -->
    <path d="M126 168h128v74a58 58 0 0 1-58 58h-12a58 58 0 0 1-58-58z"/>
    <!-- handle -->
    <path d="M254 186h20a30 30 0 0 1 0 60h-20"/>
    <!-- saucer -->
    <path d="M104 318h192"/>
    <!-- steam -->
    <path d="M166 128c0-14 12-18 12-30s-12-16-12-28" opacity=".75"/>
    <path d="M206 128c0-14 12-18 12-30s-12-16-12-28" opacity=".55"/>
  </g>
</svg>
